
[functions.parse-invoice]
enabled = true
# true a propósito (el scaffold lo deja en false): sin esto cualquiera sin
# sesión podría invocar la función y gastar la cuota de Gemini. El cliente
# de supabase-js (`functions.invoke`) ya manda el header necesario solo.
verify_jwt = true
import_map = "./functions/parse-invoice/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/parse-invoice/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/parse-invoice/*.html" ]

[functions.log-apple-pay-expense]
enabled = true
# false a propósito acá (al revés que parse-invoice): la llama un Shortcut de
# iOS, que no tiene cómo mandar un JWT de sesión de Supabase. Se autoriza con
# el secreto SHORTCUT_SECRET (header x-shortcut-secret) en vez de JWT.
verify_jwt = false
import_map = "./functions/log-apple-pay-expense/deno.json"
entrypoint = "./functions/log-apple-pay-expense/index.ts"

[functions.sync-mercadopago-expenses]
enabled = true
# true: la llama el cron de Postgres (migración 014) mandando el
# service_role key como Bearer token — un JWT válido, a diferencia del
# Shortcut de Apple Pay que no puede mandar ninguno.
verify_jwt = true
import_map = "./functions/sync-mercadopago-expenses/deno.json"
entrypoint = "./functions/sync-mercadopago-expenses/index.ts"
