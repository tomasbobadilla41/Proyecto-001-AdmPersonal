
[functions.parse-invoice]
enabled = true
# true a propósito (el scaffold lo deja en false): sin esto cualquiera sin
# sesión podría invocar la función y gastar la cuota de Gemini. El cliente
# de supabase-js (`functions.invoke`) ya manda el header necesario solo.
verify_jwt = true
import_map = "./functions/parse-invoice/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/parse-invoice/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/parse-invoice/*.html" ]

[functions.parse-payslip]
enabled = true
# Mismo motivo que parse-invoice: sin esto, cualquiera sin sesión podría
# invocarla y gastar la cuota de Gemini.
verify_jwt = true
import_map = "./functions/parse-payslip/deno.json"
entrypoint = "./functions/parse-payslip/index.ts"
